<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Oh Henry XM</title>
    <style>
        body { margin: 0; background-color: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
        
        #animation_container {
            position: absolute; margin: auto; left: 0; right: 0; top: 0; bottom: 0;
            opacity: 0; transition: opacity 0.5s ease-in-out;
        }
        
        #ba-setup-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #FFD200; color: #0C2340; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .setup-panel { 
            background: #ffffff; padding: 40px; border-radius: 20px; width: 800px; 
            text-align: center; border: 8px solid #E21836; box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
            max-height: 90vh; overflow-y: auto;
        }
        
        .slider-group { margin: 25px 0; text-align: left; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 10px; font-weight: bold; color: #0C2340;}
        input[type=range] { width: 100%; height: 15px; background: #ddd; outline: none; border-radius: 10px; cursor: pointer; }
        
        .toggle-group { display: flex; justify-content: space-between; align-items: center; margin: 25px 0; font-size: 20px; font-weight: bold; text-align: left;}
        input[type=checkbox] { transform: scale(1.5); cursor: pointer; }

        .setup-btn { 
            font-size: 24px; padding: 20px 40px; background: #E21836; color: #fff; 
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .setup-btn:hover { background: #C1102A; }
        .setup-btn:disabled { background: #888; cursor: not-allowed; }
        
        #ba-test-meter-bg { 
            position: relative; width: 100%; height: 40px; background: #ddd; border-radius: 8px; 
            overflow: hidden; border: inset 2px rgba(0,0,0,0.2);
        }
        #ba-test-meter-fill { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: #E21836; }
        .meter-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(0,0,0,0.3); z-index: 5; }

        #vu-meter-container {
            position: absolute; left: 100px; top: 340px; width: 60px; height: 400px; 
            background: rgba(12, 35, 64, 0.8); border: 6px solid #FFD200; border-radius: 30px; 
            overflow: hidden; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
        }
        #vu-meter-fill {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; 
            background: linear-gradient(to top, #FFD200, #E21836);
        }

        .cal-box { background: #f4f4f4; padding: 20px; border-radius: 10px; margin: 20px 0; border: 2px solid #ddd; text-align: left; }
        
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .motor-card { background: #f9f9f9; border: 2px solid #0C2340; border-radius: 10px; padding: 15px; text-align: center; }
        .motor-label { font-weight: bold; font-size: 18px; color: #0C2340; margin-bottom: 10px; }
        .stock-control { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .stock-btn { background: #0C2340; color: #FFD200; border: none; border-radius: 5px; width: 30px; height: 30px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .stock-display { font-size: 24px; font-weight: bold; width: 40px; text-align: center; color: #E21836; }
        .inventory-header { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }

        /* --- PRODUCTION FEATURES --- */
        #low-stock-warning {
            display: none; position: absolute; bottom: 30px; right: 30px; 
            background: #FFD200; color: #0C2340; border: 5px solid #E21836; 
            font-weight: 900; font-size: 22px; padding: 12px 24px; 
            z-index: 1000; text-transform: uppercase; font-style: italic;
            box-shadow: 4px 4px 0px #0C2340; pointer-events: none;
        }

        #debug-panel {
            display: none; position: absolute; top: 20px; left: 20px; 
            background: rgba(12, 35, 64, 0.95); color: #00FF00; font-family: 'Courier New', Courier, monospace; 
            padding: 20px; border: 2px solid #00FF00; z-index: 10000; 
            border-radius: 5px; min-width: 400px; box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
        }
        
        /* NEW: Added scrolling logic to the log so it doesn't run off screen */
        #debug-log { 
            font-size: 14px; line-height: 1.5; margin-bottom: 15px; 
            max-height: 250px; overflow-y: auto; 
        }
    </style>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <script src="index.js"></script>
    <script>
        var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
        function init() {
            canvas = document.getElementById("canvas");
            anim_container = document.getElementById("animation_container");
            dom_overlay_container = document.getElementById("dom_overlay_container");
            var comp = AdobeAn.getComposition("8921704EE35344D5B30237EACC7B31AA");
            var lib = comp.getLibrary();
            var loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
            loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
            loader.loadManifest(lib.properties.manifest);
        }
        function handleFileLoad(evt, comp) {
            var images = comp.getImages();    
            if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }    
        }
        function handleComplete(evt, comp) {
            var lib = comp.getLibrary();
            var ss = comp.getSpriteSheet();
            var queue = evt.target;
            var ssMetadata = lib.ssMetadata;
            for(i=0; i<ssMetadata.length; i++) {
                ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
            }
            exportRoot = new lib.OhHenry();
            window.mcRoot = exportRoot; 
            stage = new lib.Stage(canvas);  
            fnStartAnimation = function() {
                stage.addChild(exportRoot);
                createjs.Ticker.framerate = lib.properties.fps;
                createjs.Ticker.addEventListener("tick", stage);
            }       
            AdobeAn.makeResponsive(true,'both',true,1,[canvas,anim_container,dom_overlay_container]);   
            AdobeAn.compositionLoaded(lib.properties.id);
            fnStartAnimation();
        }
    </script>
</head>
<body onload="init();">

    <div id="debug-panel">
        <h3 style="margin-top: 0; color: #FFD200; font-family: 'Helvetica Neue', sans-serif;">⚙️ SYSTEM DIAGNOSTICS</h3>
        <div id="debug-log"></div>
        <button onclick="document.getElementById('debug-panel').style.display='none'" style="background: #E21836; color: #fff; border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px;">DISMISS</button>
    </div>

    <div id="low-stock-warning">We need more Oh Henry!</div>
    
    <div id="ba-setup-screen">
        <div class="setup-panel">
            <h1 style="font-size: 36px; margin-top: 0; text-transform: uppercase; margin-bottom: 10px;">Kiosk Setup</h1>
            
            <button id="btn-init-mic" class="setup-btn" onclick="window.handleMicInit()">1. Connect Microphone</button>
            
            <div id="tuning-controls" style="display: none; margin-top: 20px;">
                
                <div class="cal-box">
                    <div style="font-weight: bold; font-size: 18px; color: #0C2340; margin-bottom: 10px;">Ambient Noise Calibration</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button id="btn-calibrate" onclick="window.runCalibration()" style="padding: 10px 20px; font-size: 16px; background: #0C2340; color: #FFD200; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Auto-Calibrate</button>
                        <div id="val-floor" style="font-size: 20px; font-weight: bold; color: #E21836;">Baseline Floor: 0%</div>
                    </div>
                </div>

                <div class="toggle-group">
                    <label for="check-devmode">Enable Dev Mode</label>
                    <input type="checkbox" id="check-devmode" onchange="window.updateTuning()">
                </div>

                <div class="toggle-group">
                    <label style="color: #E21836;" for="check-benchtest">Disable Sensors (Bench Test)</label>
                    <input type="checkbox" id="check-benchtest" onchange="window.updateTuning()">
                </div>

                <div class="toggle-group">
                    <label for="check-deep">Require Deep Voice / Growl</label>
                    <input type="checkbox" id="check-deep" onchange="window.updateTuning()" checked>
                </div>

                <div class="slider-group">
                    <label><span>Win Target Volume Threshold</span> <span id="val-target">80%</span></label>
                    <input type="range" id="slide-target" min="10" max="100" step="5" value="80" oninput="window.updateTuning()">
                </div>

                <div class="slider-group">
                    <label><span>Microphone Sensitivity</span> <span id="val-boost">1.0x</span></label>
                    <input type="range" id="slide-boost" min="0.1" max="2.0" step="0.1" value="1.0" oninput="window.updateTuning()">
                </div>

                <div style="position: relative; margin-top: 40px; margin-bottom: 20px;">
                    <div id="win-label" style="position: absolute; top: -25px; left: 80%; transform: translateX(-50%); font-weight: bold; color: #E21836; font-size: 16px;">WIN</div>
                    <div id="win-line-indicator" style="position: absolute; top: -5px; bottom: -5px; left: 80%; width: 4px; background: #E21836; z-index: 10;"></div>
                    
                    <div id="ba-test-meter-bg">
                        <div id="ba-test-meter-fill"></div>
                        <div class="meter-line" style="left: 10%;"></div>
                        <div class="meter-line" style="left: 20%;"></div>
                        <div class="meter-line" style="left: 30%;"></div>
                        <div class="meter-line" style="left: 40%;"></div>
                        <div class="meter-line" style="left: 50%;"></div>
                        <div class="meter-line" style="left: 60%;"></div>
                        <div class="meter-line" style="left: 70%;"></div>
                        <div class="meter-line" style="left: 80%;"></div>
                        <div class="meter-line" style="left: 90%;"></div>
                    </div>
                </div>
                
                <button class="setup-btn" style="width: 100%; margin-top: 10px;" onclick="window.showInventoryScreen()">2. Manage Inventory</button>
            </div>
            
            <div id="inventory-controls" style="display: none; width: 100%;">
                <div class="inventory-header">
                    <h2 style="margin: 0; color: #0C2340;">Load Machine</h2>
                    <button onclick="window.fillAllInventory()" style="padding: 10px 20px; font-size: 14px; background: #0C2340; color: #FFD200; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Fill All to 10</button>
                </div>
                
                <div class="inventory-grid" id="inventory-grid-container">
                    </div>
                
                <div style="display: flex; gap: 20px; margin-top: 40px;">
                    <button class="setup-btn" style="background: #888; flex: 1;" onclick="window.backToTuning()">Back</button>
                    <button class="setup-btn" style="flex: 2;" onclick="window.launchKiosk()">3. Launch Experience</button>
                </div>
            </div>
        </div>
    </div>

    <div id="animation_container" style="width:1920px; height:1080px; display: none;">
        <canvas id="canvas" width="1920" height="1080" style="position: absolute; display: block;"></canvas>
        <div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1920px; height:1080px; position: absolute; left: 0px; top: 0px; display: block;"></div>
    </div>

    <div id="vu-meter-container">
        <div id="vu-meter-fill"></div>
    </div>

    <script src="js/audioProcessor.js"></script>
    <script src="js/vuMeter.js"></script>
    <script src="js/gameController.js"></script>
</body>
</html>
